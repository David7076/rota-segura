spring.application.name=rota-segura
server.port=8080

# Perfil padrão quando SPRING_PROFILES_ACTIVE não for informado
spring.profiles.default=dev

# Swagger UI na raiz (/) e versão da API usada nas rotas: /api/${api.version}/...
springdoc.swagger-ui.path=/
api.version=v1

server.forward-headers-strategy=framework
spring.jpa.open-in-view=false
